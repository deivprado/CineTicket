spring.application.name=cineticket

# --- Conexao com o Supabase (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://db.pemnldvwvptooclztrxl.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# Como as tabelas ja existem no Supabase, use "validate" (nao muda o schema)
# ou "none" se preferir nao validar nada.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true